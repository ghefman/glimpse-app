<script>
(function () {
  // STORE LINKS (also in ../index.md). App Store: live. Google Play: not yet; until
  // ANDROID_LIVE, Android visitors go to the site.
  var IOS     = 'https://apps.apple.com/app/id6829610759';
  var ANDROID = 'https://play.google.com/store/apps/details?id=com.deltawebos.glimpse';
  var ANDROID_LIVE = false;   // true once Glimpse is on Google Play; also remove `hidden` from its button below
  var SITE    = '../';

  if (/APP_STORE_ID/.test(IOS)) IOS = SITE;
  if (!ANDROID_LIVE) ANDROID = SITE;

  var m = location.search.match(/[?&]platform=([^&]*)/);
  var ua = navigator.userAgent || '';
  var target;

  if (m) {
    // Test override: ?platform=ios | android | other
    var p = decodeURIComponent(m[1]).toLowerCase();
    target = p === 'ios' ? IOS : p === 'android' ? ANDROID : SITE;
  } else if (/Android/.test(ua)) {
    target = ANDROID;
  } else if (/iPad|iPhone|iPod/.test(ua) ||
             (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) {
    // iPadOS 13+ reports a desktop Safari UA; a real Mac has maxTouchPoints 0.
    target = IOS;
  } else {
    target = SITE;
  }

  // replace() keeps this page out of history, so Back from the store
  // returns the visitor to where they came from instead of bouncing again.
  location.replace(target);
})();
</script>
